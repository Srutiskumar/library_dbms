<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Members</title>
    </div>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #searchInput {
            margin-bottom: 20px;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">Library Members</h2>

        <input type="text" id="searchInput" class="form-control" placeholder="Search members..." onkeyup="filterMembers()"><a href="{{ url_for('add_member') }}" class="btn btn-success">Add Member</a><a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Back</a>
        <table class="table table-striped table-bordered" id="membersTable">
            <thead class="table-dark">
                <tr>
                    <th>Member ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th>Membership Date</th>
                </tr>
            </thead>
            <tbody>
                {% for member in members %}
                <tr>
                    <td>{{ member.member_id }}</td>
                    <td>
                      <a href="{{url_for('profile', member_id=member.member_id)}}" class="text-decoration-none text-dark">
                        {{ member.name }}
                      </a>
                    </td>
                    <td>{{ member.email }}</td>
                    <td>{{ member.phone }}</td>
                    <td>{{ member.address }}</td>
                    <td>{{ member.membership_date }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <script>
        function filterMembers() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const table = document.getElementById('membersTable');
            const rows = table.getElementsByTagName('tr');

            for (let i = 1; i < rows.length; i++) { // skip header
                const cells = rows[i].getElementsByTagName('td');
                const name = cells[1].textContent.toLowerCase();
                const email = cells[2].textContent.toLowerCase();
                const phone = cells[3].textContent.toLowerCase();
                
                if (name.includes(input) || email.includes(input) || phone.includes(input)) {
                    rows[i].style.display = '';
                } else {
                    rows[i].style.display = 'none';
                }
            }
        }
    </script>
</body>
</html>
