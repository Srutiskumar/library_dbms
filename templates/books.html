<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #searchInput {
            margin-bottom: 20px;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">Available Books</h2>

        <input type="text" id="searchInput" class="form-control" placeholder="Search books by title..." onkeyup="filterBooks()"><a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Back</a>

        <table class="table table-striped table-bordered" id="booksTable">
            <thead class="table-dark">
                <tr>
                    <th>Copy ID</th>
                    <th>Title</th>
                </tr>
            </thead>
            <tbody>
                {% for book in books %}
                <tr>
                    <td>{{ book.copy_id }}</td>
                    <td>{{ book.title }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <script>
        function filterBooks() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const table = document.getElementById('booksTable');
            const rows = table.getElementsByTagName('tr');

            for (let i = 1; i < rows.length; i++) { // skip header
                const titleCell = rows[i].getElementsByTagName('td')[1];
                if (titleCell) {
                    const title = titleCell.textContent.toLowerCase();
                    rows[i].style.display = title.includes(input) ? '' : 'none';
                }
            }
        }
    </script>
</body>
</html>
