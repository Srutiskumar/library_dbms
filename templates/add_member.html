<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Member</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">Add New Member</h2>

        <form action="{{ url_for('add_member') }}" method="POST">
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" name="name" class="form-control" id="name" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" name="email" class="form-control" id="email" required>
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">Phone</label>
                <input type="text" name="phone" class="form-control" id="phone" required>
            </div>

            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <textarea name="address" class="form-control" id="address" rows="3"></textarea>
            </div>

            <div class="mb-3">
                <label for="membership_date" class="form-label">Membership Date</label>
                <input type="date" name="membership_date" class="form-control" id="membership_date" required>
            </div>

            <button type="submit" class="btn btn-success">Add Member</button>
            <a href="{{ url_for('members') }}" class="btn btn-secondary">Back</a>
        </form>
    </div>
</body>
</html>
